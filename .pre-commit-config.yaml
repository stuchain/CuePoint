# Mirrors the Python gates in AGENTS.md: ruff for lint and format, plus basic
# file hygiene. Keep the ruff rev in step with the pinned ruff in the dev
# requirements so local commits and CI agree.
#
# mypy is deliberately not wired in here. `mypy src/` still reports real errors
# on the current tree, so adding it would block every commit rather than gate
# new work. Run it manually per AGENTS.md until that backlog is cleared.

default_language_version:
  python: python3

exclude: |
  (?x)^(
      \.venv/
    | node_modules/
    | build/
    | dist/
    | electron-dist/
    | release/
    | output/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: check-json
        # The renderer tsconfigs are JSONC (Vite emits them with comments).
        exclude: ^apps/desktop-electron/renderer/tsconfig\..*\.json$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
