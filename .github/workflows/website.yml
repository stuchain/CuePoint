# Type-checks, tests and builds the website (apps/website) and uploads the built site.
# After the build: DEC-141's checks (SITE-03), each its own step so a failure names the check.
# SITE-13: on the `website` branch (DEC-235), after every check passes, the public build deploys to
# GitHub Pages and a smoke job fetches it back. Every other build stays a preview with noindex.
# Publishing is `git push origin feature:website`: the branch only ever moves up to `feature`. A
# publish that changes no file below is deployed by running this workflow by hand on `website`.
name: Website

on:
  push:
    paths:
      - 'apps/website/**'
      - 'docs/user-guide/**'
      - 'docs/release/CHANGELOG.md'
      - 'apps/desktop-electron/renderer/src/tokens/**'
      - 'apps/desktop-electron/build/icon-source/**'
      - 'apps/desktop-electron/build/icon.ico'
      - 'apps/desktop-electron/build/icons/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'apps/website/**'
      - 'docs/user-guide/**'
      - 'docs/release/CHANGELOG.md'
      - 'apps/desktop-electron/renderer/src/tokens/**'
      - 'apps/desktop-electron/build/icon-source/**'
      - 'apps/desktop-electron/build/icon.ico'
      - 'apps/desktop-electron/build/icons/**'
      - '.github/workflows/website.yml'
  # by hand, and by the release workflow after it publishes, so the download page lists the release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Test
        run: npm test

      # The build reads GitHub's release list (scripts/fetch-releases.mjs); in CI a failed read fails the build.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check the built site (titles, headings, links, schema, sitemap)
        run: npm run check:site

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Lighthouse launches Chrome through chrome-launcher, which honours CHROME_PATH: give it the
      # pinned Playwright Chromium instead of whatever the runner image ships.
      - name: Point Lighthouse at Playwright's Chromium
        run: echo "CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Accessibility, widths and tap targets (axe, Playwright)
        run: npm run test:e2e

      # The download page as it will look once a release exists (built by test:e2e's pre-step).
      - name: Check the built site with a release (download page fixture)
        run: node scripts/check-site.mjs dist-fixture

      - name: Speed budgets (Lighthouse CI)
        run: npm run check:lighthouse

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
          if-no-files-found: error

      - name: Upload test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-reports
          path: |
            apps/website/playwright-report
            apps/website/.lighthouseci
          if-no-files-found: ignore

  # The public build: the same checkout with PUBLIC set to true (scripts/make-public.mjs), held by the
  # public rules of check-site (no placeholder, nothing unshipped, no noindex on a content page).
  deploy:
    needs: website
    if: github.ref == 'refs/heads/website' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Make this build public
        run: node scripts/make-public.mjs

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check the public build
        run: npm run check:site

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fetches the live home, robots.txt and the sitemap over HTTPS and checks the canonical is the address.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      # smoke-live reads the address through check-site.mjs, which imports the site's packages
      - name: Install dependencies
        run: npm ci

      # Pages' own address for this deploy: the custom domain once it is set, else the github.io one.
      - name: Fetch the live site
        run: node scripts/smoke-live.mjs "${{ needs.deploy.outputs.page_url }}"
