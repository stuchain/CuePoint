# Runs only what a CI fix needs to see again: some pytest paths, some Playwright specs, or both,
# on one runner. A full Desktop Electron run takes up to two hours across four systems; this
# checks one failure on its own system in minutes. It gates nothing: the full workflows still
# decide whether a commit is green.
#
# Two ways to start it:
# - push a scratch branch `ci-focus/<name>` carrying `.github/ci-focus.json`, e.g.
#   {"runner": "windows-latest", "pytest": "src/tests/unit/engine/test_x.py", "e2e": "", "repeat": 3}
#   (no other workflow runs on those branches);
# - once this file is on the default branch, Actions → CI focus → Run workflow.
name: CI focus

on:
  push:
    branches: ['ci-focus/**']
  workflow_dispatch:
    inputs:
      runner:
        description: The system to run on
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
        default: windows-latest
      pytest:
        description: pytest paths or node ids, space separated (empty runs none)
        type: string
        default: ""
      e2e:
        description: Playwright spec files under apps/desktop-electron, space separated (empty runs none)
        type: string
        default: ""
      repeat:
        description: Times to run each test, to see whether a failure is steady or intermittent
        type: number
        default: 1

# Each run stands alone: never queued behind, or replacing, the branch's full runs.
concurrency:
  group: ci-focus-${{ github.run_id }}

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-pin mpv to the current git-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/mpv-player/mpv/releases/tags/git-release | python -c "import json,sys; r=json.load(sys.stdin); print(r.get('published_at'), r.get('name')); [print(a['name'], a['size'], a['updated_at']) for a in r.get('assets',[])]"
          python scripts/fetch_player_sidecar.py --update-manifest
          echo "::group::manifest"
          cat scripts/player_sidecar_manifest.json
          echo "::endgroup::"
          git diff --stat
