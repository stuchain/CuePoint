# Checks links in docs/ and .github/ with lychee and fails CI on broken links.
# Runs when docs, workflows or .lycheeignore change.
name: Docs Check

on:
  push:
    branches: ['main', 'main_deprecated', 'feature']
    paths: ['docs/**', '.github/**', '.lycheeignore']
  pull_request:
    branches: ['main', 'main_deprecated', 'feature']
    paths: ['docs/**', '.github/**', '.lycheeignore']

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: 'docs/ .github/ --no-progress --root-dir ${{ github.workspace }}'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
