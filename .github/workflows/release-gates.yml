# Release gates: version sync, changelog, SBOM, hashed-install check, licence
# bundle, ruff, mypy gate, the Qt and dead-code guards and file sizes on every PR and push;
# the unit, integration and system tests on Linux (Python 3.11 and 3.12), macOS and
# Windows (3.12) on push only. This is the one place the Python suite runs per push.
name: Release Gates

on:
  push:
    branches:
      - main
      - feature
      - 'phase_*'
    # Docs still start it: tests read docs. A workflow skipped by `paths-ignore` reports no check at
    # all, so if any of these ever becomes a required check, a website-only pull request would wait
    # for it forever.
    paths-ignore: ['apps/website/**', 'apps/promo-video/**']
  # The release gates proper (version sync, changelog, SBOM, licences, lint,
  # types, formatting) are cheap and belong on every PR; before this they only
  # ran after merge. The heavy matrix below stays on push: `test.yml` already
  # runs the suite on PRs, and repeating it across 3 OSes would be
  # four duplicate jobs per PR.
  pull_request:
    branches:
      - main
      - feature
    paths-ignore: ['apps/website/**', 'apps/promo-video/**']
  workflow_dispatch:

# One run at a time per ref. Everything except `main` and tags cancels (`feature`, `phase_*`,
# pull requests, manual runs): the newest push wins, and a push cancels the run still going for
# an older commit, so a busy branch does not queue hours of runs for commits already superseded.
# `main` and tags never cancel: every commit there keeps its own full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-gates:
    name: Test Gates
    # Covered on pull requests by test.yml; see the trigger comment above.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Python 3.12 is what the app ships and runs on all three systems; 3.11 is still supported
      # and is tested on Linux only (it is the same code on every system, and each extra Mac or
      # Windows job is minutes of queueing on a free account).
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: macos-latest, python-version: '3.12' }
          - { os: windows-latest, python-version: '3.12' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        # Two passes in one step. The first runs in parallel (pytest-xdist, one worker per core): the
        # unit layer took 14 minutes one test at a time on Linux and 8.4 minutes with `-n 4` on a
        # 4-core box, and it is what let Windows go back to one leg instead of two halves. The second
        # runs the tests marked `serial` alone, after the pass: they are timing-sensitive and fail under
        # the load of the parallel run (pytest.ini). `-q` for the first, as xdist's `-v` prints a line
        # per test per worker.
        # Coverage is measured on Python 3.12 only (DEC-220). 3.11 has no sys.monitoring,
        # and its line tracer doubles the suite: Ubuntu ran it in 14 minutes on 3.11
        # against 7.5 on 3.12. The 3.11 legs still run every unit test; the 3.12 legs on all
        # three systems hold the coverage gate. The second pass appends to the first's data.
        # A test that hangs stops the run at 300 s with every thread's stack, where the step's
        # own 30 minutes stopped it with none: one hung on Windows 3.12 with nothing to say why.
        shell: bash
        run: |
          cov1=""
          cov2=""
          if [ "${{ matrix.python-version }}" != "3.11" ]; then
            cov1="--cov=src/cuepoint --cov-report="
            cov2="--cov=src/cuepoint --cov-append --cov-report=xml"
          fi
          # shellcheck disable=SC2086
          pytest src/tests/unit/ -n auto -m "not serial" -q --durations=30 --timeout=300 --timeout-method=thread $cov1
          # shellcheck disable=SC2086
          # Exit code 5 (no test collected) is fine for this pass only: it holds just the tests marked
          # `serial`, and a pass with none has nothing to run. Any other failure stops the step.
          rc=0
          pytest src/tests/unit/ -m serial -v --durations=30 --timeout=300 --timeout-method=thread $cov2 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
        env:
          COVERAGE_CORE: sysmon
        timeout-minutes: 30
        continue-on-error: false

      - name: Run integration tests
        run: |
          pytest src/tests/integration/ -v --timeout=120
        continue-on-error: false

      # Moved here from test.yml, which now runs on pull requests only. `-m "not slow"` is how
      # test.yml ran every layer (`run_tests.py --all --no-slow`).
      - name: Run system tests
        run: |
          pytest src/tests/system/ -q --timeout=300 -m "not slow"
        continue-on-error: false

      # test.yml ran this layer too (`run_tests.py --all`), the same way: not slow, 300 s.
      - name: Run regression tests
        run: |
          pytest src/tests/regression/ -q --timeout=300 -m "not slow"
        continue-on-error: false

      - name: Upload coverage
        if: matrix.python-version != '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          minimum_coverage: 35

      - name: Check test coverage
        if: matrix.python-version != '3.11'
        run: |
          coverage report --fail-under=35
        continue-on-error: false

  code-quality-gates:
    name: Code Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify version sync (release gate R001)
        run: python scripts/validate_version.py

      - name: Validate changelog (release gate R002)
        run: python scripts/validate_changelog.py

      - name: Generate SBOM (release gate R003)
        run: python scripts/generate_sbom.py --output build/sbom.spdx.json

      - name: Validate deterministic build (pip --require-hashes, Design 2.8)
        run: |
          python -m pip install "pip<26"
          python -m pip install pip-tools
          python scripts/generate_requirements_hashes.py
          pip install -r requirements-build-hashed.txt --require-hashes
          echo "Deterministic install verified: pip --require-hashes succeeded"

      - name: License bundle (release gate R004, Step 11)
        run: |
          pip install -r requirements-build.txt -q
          python scripts/generate_licenses.py --output THIRD_PARTY_LICENSES.txt
          if [ ! -f THIRD_PARTY_LICENSES.txt ]; then
            echo "ERROR: License bundle generation failed"
            exit 1
          fi
          if ! grep -q "Package:" THIRD_PARTY_LICENSES.txt; then
            echo "ERROR: License bundle appears empty"
            exit 1
          fi

      - name: Run linter
        run: |
          ruff check src/
        continue-on-error: false

      # test_step55_mypy_validation.py cannot fail — its ignore lists cover
      # every mypy error category — so it is a debt record, not a gate.
      # test_mypy_foundation.py is the gate.
      - name: Run type checker
        run: |
          python -m pytest src/tests/integration/test_mypy_foundation.py -v
          python -m pytest src/tests/integration/test_step55_mypy_validation.py -v
        continue-on-error: false

      - name: Check code formatting
        run: |
          ruff format --check src/
        continue-on-error: false

      - name: Check file sizes
        run: |
          python scripts/check_file_sizes.py
        continue-on-error: false

      # Moved here from test.yml, which now runs on pull requests only.
      - name: Verify Qt has not come back
        run: python scripts/check_no_qt.py

      # Fails on a Python module, script or renderer file nothing shipped or
      # run reaches (a file only a test reaches counts as dead).
      # See docs/v1/archive/PHASE12_CLEANUP.md, PRUNE-08.
      - name: Dead-code guard
        run: python scripts/audit_dead_code.py --check

  # The "Build Gates" job was removed here. It ran `python build.py`, a script
  # that does not exist in this repository, behind `|| echo "Build script not
  # found - skipping"` and `continue-on-error: true` — so it could not fail, and
  # its green tick meant nothing. Real packaging is covered by
  # desktop-electron.yml (PyInstaller sidecar + electron-builder).
