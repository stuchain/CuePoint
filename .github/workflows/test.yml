# The main Python test workflow: ruff lint and format, the mypy gate, the Qt-removal
# check, and the unit, integration and system tests with coverage, plus a large-file
# check. Runs on pull requests only: a push is covered by release-gates.yml, which runs the
# same suite on 3 systems (with the system and regression tests and the dead-code guard), so
# running it here too ran the whole Python suite twice per push.
name: Test

on:
  # Without this, a pull request ran no Python tests at all: every gate lived on
  # push-to-branch workflows, so a PR could be reviewed and merged green having
  # never had the suite run against it.
  pull_request:
    branches: ['main', 'feature']
    # Docs still start it: tests read docs. A workflow skipped by `paths-ignore` reports no check at
    # all, so if any of these ever becomes a required check, a website-only pull request would wait
    # for it forever.
    paths-ignore: ['apps/website/**', 'apps/promo-video/**']

# One run at a time per ref. Everything except `main` and tags cancels (`feature`, `phase_*`,
# pull requests, manual runs): the newest push wins, and a push cancels the run still going for
# an older commit, so a busy branch does not queue hours of runs for commits already superseded.
# `main` and tags never cancel: every commit there keeps its own full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Enforced, not "|| true". These previously ran with their exit codes
      # discarded, so a lint or type error produced a green tick and no signal
      # — worse than not running them, because the check looked covered.
      - name: Lint
        run: ruff check src/

      - name: Check formatting
        run: ruff format --check src/

      # test_step55_mypy_validation.py filters mypy's output through ignore
      # lists broad enough to swallow every error category, so it cannot fail;
      # it records legacy gradual-typing debt. test_mypy_foundation.py is the
      # gate: any type error in the v1 foundation modules fails the build.
      - name: Type check
        run: |
          python -m pytest src/tests/integration/test_mypy_foundation.py -q
          python -m pytest src/tests/integration/test_step55_mypy_validation.py -q

      # Dependency and static-analysis scanning lives in security-scan.yml,
      # which runs on push, PR and a weekly schedule. Duplicating it here with
      # discarded exit codes added CI time and no coverage.

      - name: Verify Qt has not come back
        run: python scripts/check_no_qt.py

      # Fails on a Python module, script or renderer file nothing shipped or
      # run reaches (a file only a test reaches counts as dead).
      # See docs/v1/archive/PHASE12_CLEANUP.md, PRUNE-08.
      - name: Dead-code guard
        run: python scripts/audit_dead_code.py --check

      - name: Run tests (unit, integration, system)
        run: |
          python scripts/run_tests.py --all --coverage --no-slow

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Check for large files
        run: |
          python scripts/check_large_files.py
