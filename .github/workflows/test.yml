name: Test

on:
  push:
    branches: ['main', 'main_deprecated', 'phase_*', 'feature']
  # Without this, a pull request ran no Python tests at all: every gate lived on
  # push-to-branch workflows, so a PR could be reviewed and merged green having
  # never had the suite run against it.
  pull_request:
    branches: ['main', 'feature']

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Enforced, not "|| true". These previously ran with their exit codes
      # discarded, so a lint or type error produced a green tick and no signal
      # — worse than not running them, because the check looked covered.
      - name: Lint
        run: ruff check src/

      - name: Check formatting
        run: ruff format --check src/

      - name: Type check
        run: python -m pytest src/tests/integration/test_step55_mypy_validation.py -q -p no:pytest-qt

      # Dependency and static-analysis scanning lives in security-scan.yml,
      # which runs on push, PR and a weekly schedule. Duplicating it here with
      # discarded exit codes added CI time and no coverage.

      - name: Verify no Qt imports in core packages
        run: python scripts/check_no_qt_in_core.py

      - name: Run tests (unit, integration, system)
        run: |
          python scripts/run_tests.py --all --coverage --no-slow

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Check for large files
        run: |
          python scripts/check_large_files.py
