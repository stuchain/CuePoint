name: Desktop Electron

on:
  push:
    branches: [main, feature, 'phase_*']
  pull_request:
    branches: [main, feature]

jobs:
  desktop-electron:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop-electron/package-lock.json
            apps/desktop-electron/renderer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install desktop dependencies
        working-directory: apps/desktop-electron
        run: |
          npm ci
          npm ci --prefix renderer

      - name: Lint and unit test renderer
        working-directory: apps/desktop-electron/renderer
        run: |
          npm run lint
          npm test

      - name: Typecheck renderer
        working-directory: apps/desktop-electron/renderer
        run: npm run typecheck

      # The main process was never type-checked in CI, which is how five type
      # errors survived in main.ts. It spawns the sidecars, owns the IPC surface
      # and, per DEC-050, owns playback state.
      - name: Typecheck Electron main process
        working-directory: apps/desktop-electron
        run: npm run typecheck

      - name: Build desktop shell
        working-directory: apps/desktop-electron
        run: npm run build

      - name: Build engine sidecar (packaged smoke)
        run: python scripts/build_engine_sidecar.py

      - name: Verify no Qt imports in core packages
        run: python scripts/check_no_qt_in_core.py

      # PLAYER-01 (DEC-049). Exits 0 with a notice on Linux, which pins no
      # binary, so the ubuntu leg of the matrix stays green.
      - name: Fetch player sidecar (mpv)
        run: python scripts/fetch_player_sidecar.py

      - name: Player sidecar format decode check
        run: python scripts/fetch_player_sidecar.py --check-formats

      - name: Bundled component licences
        run: python scripts/check_bundled_licenses.py

      # PLAYER-02/03: main-process tests. Runs on all three OSes because the
      # client speaks a named pipe on Windows and a unix socket elsewhere, and
      # only the matrix exercises both. The PLAYER-03 integration tests drive
      # the real mpv binary fetched above, and skip themselves on Linux, which
      # pins none.
      - name: Unit test Electron main process
        working-directory: apps/desktop-electron
        run: npm test

      - name: Player sidecar tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests/unit/scripts/test_fetch_player_sidecar.py src/tests/unit/scripts/test_check_bundled_licenses.py src/tests/integration/test_player_sidecar_binary.py -q --tb=short

      - name: Engine unit tests (HTTP API)
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests/unit/engine/ -q --tb=short

      - name: Engine health smoke
        env:
          PYTHONPATH: src
        run: python scripts/smoke_engine_health.py

      - name: Desktop version coupling
        env:
          PYTHONPATH: src
        run: python scripts/check_desktop_version_coupling.py

      - name: Install Playwright Chromium
        working-directory: apps/desktop-electron
        run: npx playwright install chromium

      - name: Playwright Electron smoke
        working-directory: apps/desktop-electron
        run: npm run test:e2e

      - name: Build Electron installers + artifacts
        working-directory: apps/desktop-electron
        run: npm run dist

      - name: Generate SHA256SUMS
        working-directory: apps/desktop-electron
        run: python ../../scripts/generate_sha256_sums.py release

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-electron-${{ matrix.os }}
          path: apps/desktop-electron/release/**
