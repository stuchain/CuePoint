# Builds and tests the Electron desktop app: renderer lint, tests and typecheck,
# the Electron main process, the Python engine sidecar and the mpv player sidecar
# (format and waveform checks, bundled licences). This is the packaging workflow.
name: Desktop Electron

on:
  # No `main`: main only gets merges for a release, and the tag's release build (`release.yml`
  # calls this workflow) builds main's commit again, so a push there ran the same four legs twice
  # and held two Mac runners the release needed. A pull request into main still builds.
  push:
    branches: [feature, 'phase_*']
    # Docs still start it: tests read docs. A workflow skipped by `paths-ignore` reports no check at
    # all, so if any of these ever becomes a required check, a website-only pull request would wait
    # for it forever.
    paths-ignore: ['apps/website/**', 'apps/promo-video/**']
  pull_request:
    branches: [main, feature]
    paths-ignore: ['apps/website/**', 'apps/promo-video/**']
  # DIST-04: `release.yml` calls this for a tag. With `release: true` the Sentry upload is
  # required and each leg also uploads `release-<leg>`, the files the release is made of.
  # A push or pull request does not set it, so `inputs.release` is empty there and false here.
  workflow_call:
    inputs:
      release:
        description: Build for a release (required source-map upload, release files kept)
        type: boolean
        default: false

# One run at a time per ref. Everything except `main` and tags cancels (`feature`, `phase_*`,
# pull requests, manual runs): the newest push wins, and a push cancels the run still going for
# an older commit, so a busy branch does not queue hours of runs for commits already superseded.
# `main` and tags never cancel: every commit there keeps its own full result. `release.yml` calls this workflow too; inside a call the group is the
# caller's workflow and the tag's ref, so a release build never cancels either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop-electron:
    strategy:
      fail-fast: false
      # Legs are named by system and chip (DIST-02, DEC-129). `builder_arch` is what electron-builder
      # is told on a Mac so a runner's default never decides the chip; `chip` and `mac_dir` feed the
      # Mac bundle checks (electron-builder writes `mac-arm64/` for arm64 and `mac/` for x64).
      matrix:
        include:
          - leg: windows-x64
            runner: windows-latest
            builder_arch: ""
          - leg: linux-x64
            runner: ubuntu-latest
            builder_arch: ""
          - leg: macos-arm64
            runner: macos-latest
            builder_arch: "--arm64"
            chip: arm64
            mac_dir: mac-arm64
          - leg: macos-x64
            runner: macos-15-intel
            builder_arch: "--x64"
            chip: x64
            mac_dir: mac
    runs-on: ${{ matrix.runner }}
    # HARDEN-09: a hung app must not hold a runner for the 6 hours GitHub allows. Release runs the whole
    # suite packaged (up to 75 minutes); the v1.0.0 Intel leg ran out of 150 minutes there, so a
    # release gets 210.
    timeout-minutes: ${{ inputs.release && 210 || 150 }}

    env:
      # The commit this build is made from: main and the engine sidecar record it, and it is
      # Sentry's `dist` for all three processes (REPORT-07).
      # On a pull request `github.sha` is a merge commit nobody can check out, so the head is used.
      CUEPOINT_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only whether the secret exists: `secrets.*` cannot be read in a step's `if:`, and the token
      # itself is given to the one step that uses it, not to npm install scripts, pip, pytest or the app.
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop-electron/package-lock.json
            apps/desktop-electron/renderer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Electron's own download, electron-builder's tool downloads and Playwright's Chromium come
      # from other hosts than npm, so `cache: npm` above does not hold them. Keyed on the lockfile
      # (it pins the versions); an older entry still saves most of the download. Read-only safe on
      # a release too, so it is not switched off there.
      - name: Cache Electron, electron-builder and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/ms-playwright
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/ms-playwright
          key: desktop-dl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop-electron/package-lock.json') }}
          restore-keys: |
            desktop-dl-${{ runner.os }}-${{ runner.arch }}-

      - name: Install desktop dependencies
        working-directory: apps/desktop-electron
        run: |
          npm ci
          npm ci --prefix renderer

      - name: Lint renderer
        working-directory: apps/desktop-electron/renderer
        run: npm run lint

      # The renderer's unit tests are plain JavaScript in jsdom: the same on every system and chip,
      # so one leg runs them. Linux is the fastest runner (6 minutes against 7 to 11 elsewhere), and
      # the slow Intel Mac once timed out and missed findBy queries that pass elsewhere.
      - name: Unit test renderer
        if: matrix.leg == 'linux-x64'
        working-directory: apps/desktop-electron/renderer
        run: npm test

      - name: Typecheck renderer
        working-directory: apps/desktop-electron/renderer
        run: npm run typecheck

      # The main process was never type-checked in CI, which is how five type
      # errors survived in main.ts. It spawns the sidecars, owns the IPC surface
      # and, per DEC-050, owns playback state.
      - name: Typecheck Electron main process
        working-directory: apps/desktop-electron
        run: npm run typecheck

      - name: Build desktop shell
        working-directory: apps/desktop-electron
        run: npm run build

      # DIST-04. A release keeps its source-map upload (REPORT-07): without the secret the leg
      # fails here, before the installers are built, instead of shipping unreadable stack traces.
      - name: Require the Sentry token for a release
        if: inputs.release && env.HAS_SENTRY_TOKEN != 'true'
        shell: bash
        run: |
          echo "::error::A release build needs the SENTRY_AUTH_TOKEN secret, so its source maps are uploaded (REPORT-07). Add the repository secret and push the tag again."
          exit 1

      # REPORT-07. Each OS leg builds its own bundles, so each uploads its own maps: the debug id
      # that `inject` writes into every file and its map ties a stack frame to its map whatever the
      # leg, so the same release and dist from three legs do not collide. Must run after the last
      # `npm run build` (a rebuild would drop the debug ids) and before electron-builder packs. It
      # runs straight after the build so a failing test or end-to-end step never holds the maps back.
      - name: Upload source maps to Sentry
        # Pushes only (a pull request builds from code nobody has merged), and only with the secret.
        # Called from `release.yml` on a tag, `github.event_name` is the caller's: 'push'.
        if: github.event_name == 'push' && env.HAS_SENTRY_TOKEN == 'true'
        # A Sentry outage must not stop the installers; a release build is the release, so it must succeed.
        continue-on-error: ${{ !inputs.release }}
        shell: bash
        working-directory: apps/desktop-electron
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: cuepoint
          SENTRY_PROJECT: electron
        run: |
          version="$(node -p "require('./package.json').version")"
          dist="${CUEPOINT_BUILD_COMMIT:0:7}"
          npx sentry-cli sourcemaps inject electron-dist renderer/dist
          npx sentry-cli sourcemaps upload --release "cuepoint@${version}" --dist "${dist}" electron-dist renderer/dist

      - name: Build engine sidecar (packaged smoke)
        run: python scripts/build_engine_sidecar.py

      - name: Verify Qt has not come back
        run: python scripts/check_no_qt.py

      # PLAYER-01 (DEC-049). Exits 0 with a notice on Linux, which pins no
      # binary, so the ubuntu leg of the matrix stays green.
      - name: Fetch player sidecar (mpv)
        run: python scripts/fetch_player_sidecar.py

      - name: Player sidecar format decode check
        run: python scripts/fetch_player_sidecar.py --check-formats

      # WAVE-01 (DEC-123): the waveform pipeline on the pinned binary. Exact
      # length, band separation and channel order, proved with tones, because
      # the macOS and Windows builds carry different FFmpeg versions.
      - name: Player sidecar waveform analysis check
        run: python scripts/fetch_player_sidecar.py --check-analysis

      # C19g (DEC to come): the packaged engine (built above) starts its
      # analysis worker, the worker reuses the engine's unpacked folder (no
      # second unpack), and the bytes match the in-process computer's. Like the
      # checks above it ends with a notice where no mpv is pinned (Linux).
      - name: Frozen engine analysis worker check
        run: python scripts/fetch_player_sidecar.py --check-analysis-worker auto

      - name: Bundled component licences
        run: python scripts/check_bundled_licenses.py

      # PLAYER-02/03: main-process tests. Runs on all three OSes because the
      # client speaks a named pipe on Windows and a unix socket elsewhere, and
      # only the matrix exercises both. The PLAYER-03 integration tests drive
      # the real mpv binary fetched above, and skip themselves on Linux, which
      # pins none.
      - name: Unit test Electron main process
        working-directory: apps/desktop-electron
        run: npm test

      - name: Player sidecar tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests/unit/scripts/test_fetch_player_sidecar.py src/tests/unit/scripts/test_check_bundled_licenses.py src/tests/integration/test_player_sidecar_binary.py src/tests/unit/data/test_audio_decode.py src/tests/integration/test_audio_decode_binary.py src/tests/integration/test_waveform_service_binary.py src/tests/integration/test_waveform_analysis_binary.py -q --tb=short

      # The engine's unit tests are not run here: release-gates.yml runs all of src/tests/unit/ on
      # Linux, macOS and Windows for the same commit, so a third run in every leg added 4 to 8
      # minutes and found nothing new. The smoke below starts the engine this leg built.
      - name: Engine health smoke
        env:
          PYTHONPATH: src
        run: python scripts/smoke_engine_health.py

      - name: Desktop version coupling
        env:
          PYTHONPATH: src
        run: python scripts/check_desktop_version_coupling.py

      - name: App icons match their sources
        run: python scripts/build_app_icons.py --check

      # The Windows runner has no sound device, so mpv opens no output and every player test
      # fails; Scream is a virtual one.
      - name: Give the Windows runner a sound device
        if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@v1

      - name: Install Playwright Chromium
        working-directory: apps/desktop-electron
        run: npx playwright install chromium

      # The Linux runner has no mpv and no audio device: a distribution mpv (no mpv ships for Linux;
      # a distribution mpv via CUEPOINT_MPV_PATH is the documented path) and a PulseAudio null sink
      # for it to open. Its own step, so the packaged run below has them too. Playwright's browser is
      # installed above without `--with-deps`, which must not be used on Ubuntu 26.04.
      - name: Install mpv and a null sound device (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          echo "CUEPOINT_MPV_PATH=/usr/bin/mpv" >> "$GITHUB_ENV"

      # The Linux runner has no display. Without one Electron exits at once, but Playwright waits out
      # its whole launch timeout for each test, so the step ran for hours; Xvfb gives it a screen.
      # The whole suite against the development build on every leg of a push or pull request. A release
      # skips it: the packaged run below then runs the same specs, all of them, against the real app,
      # so running the development build first only added 22 to 42 minutes to each leg. One gap: the
      # specs in beatportSignIn.spec.ts that need the sign-in stand-in skip themselves against a packaged
      # app (it is honoured only by an unpackaged one), so only push and pull request runs cover them.
      # `@dom-only` specs (axe over the window's DOM, the same on every system) run on Linux only here;
      # the packaged release run still runs them on all four legs.
      - name: Playwright Electron smoke
        if: ${{ !inputs.release }}
        working-directory: apps/desktop-electron
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e -- --grep-invert @dom-only
          fi

      # Each failure's error-context.md holds what the page showed, which the log does not. (A release
      # skips the run above, so only the packaged run's own steps further down have anything to show.)
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.leg }}
          path: apps/desktop-electron/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      # The same snapshots in the log, for readers who cannot download artifacts.
      - name: Print Playwright failure snapshots
        if: failure()
        shell: bash
        working-directory: apps/desktop-electron
        run: |
          find test-results -name error-context.md 2>/dev/null | sort | while read -r f; do
            echo "::group::$f"
            head -c 20000 "$f"
            echo "::endgroup::"
          done

      # No map ships: electron-builder's `files` excludes them too, and this keeps them off the disk
      # that is packed from, uploaded or not.
      - name: Delete source maps
        if: always()
        shell: bash
        working-directory: apps/desktop-electron
        run: |
          node -e "const fs=require('fs'),p=require('path');const w=d=>{if(!fs.existsSync(d))return;for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name);if(e.isDirectory())w(f);else if(f.endsWith('.map'))fs.rmSync(f)}};['electron-dist','renderer/dist'].forEach(w)"

      # `package`, not `dist`: `dist` builds again first, which would replace the files that
      # carry the debug ids.
      #
      # `!cancelled()`: under the default `success()` a red development suite skipped this step, and
      # with it every packaged step after it, so a leg never showed whether its installer or its
      # packaged app worked. A green run runs exactly what it ran before.
      - name: Build Electron installers + artifacts
        id: package
        if: ${{ !cancelled() }}
        working-directory: apps/desktop-electron
        run: npm run package -- ${{ matrix.builder_arch }}

      # DIST-02. Unsigned, so no `--expect-hardened-runtime`: the structural checks only.
      - name: Check bundle architecture
        if: startsWith(matrix.leg, 'macos')
        run: python scripts/check_bundle_arch.py apps/desktop-electron/release/${{ matrix.mac_dir }}/CuePoint.app --arch ${{ matrix.chip }}

      - name: Verify macOS bundle
        if: startsWith(matrix.leg, 'macos')
        run: python scripts/verify_macos_bundle.py apps/desktop-electron/release/${{ matrix.mac_dir }}/CuePoint.app

      # HARDEN-09. The app electron-builder just made, on every leg: the folder it leaves beside the
      # installer, found the way `scale.yml` finds it. `build.linux.executableName` names the Linux
      # file; the Windows one is `win-unpacked`; a Mac's is the .app in the leg's `mac_dir`.
      - name: Locate the packaged app
        id: app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        working-directory: apps/desktop-electron
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe="release/win-unpacked/CuePoint.exe" ;;
            macOS) exe="release/${{ matrix.mac_dir }}/CuePoint.app/Contents/MacOS/CuePoint" ;;
            Linux)
              name="$(node -p "require('./package.json').build.linux.executableName")"
              exe="release/linux-unpacked/${name}"
              ;;
          esac
          test -f "$exe" || { echo "::error::No packaged app at $exe"; ls -la release; exit 1; }
          echo "exe=$PWD/$exe" >> "$GITHUB_OUTPUT"

      # REPORT-07 (PHASE13_REPORTING.md): the source maps went to Sentry and were deleted before
      # packing, so none ships. Looked for in the app's archive and beside it.
      - name: Check no source map ships
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: apps/desktop-electron
        shell: bash
        env:
          APP_EXE: ${{ steps.app.outputs.exe }}
        run: |
          case "$RUNNER_OS" in
            macOS) resources="$(dirname "$APP_EXE")/../Resources" ;;
            *) resources="$(dirname "$APP_EXE")/resources" ;;
          esac
          test -f "$resources/app.asar" || { echo "::error::No app.asar in $resources"; exit 1; }
          # Listed to a file first: a failed `asar list` must fail the step, not read as "no maps".
          npx asar list "$resources/app.asar" > "$RUNNER_TEMP/asar-list.txt" || { echo "::error::asar list failed"; exit 1; }
          inside="$(grep -c '\.map$' "$RUNNER_TEMP/asar-list.txt" || true)"
          beside="$(find "$resources" -name '*.map' | wc -l | tr -d ' ')"
          echo "source maps in app.asar: $inside, beside it: $beside"
          test "$inside" = "0" && test "$beside" = "0" || { echo "::error::A source map ships in the package"; exit 1; }

      # The source run above (not on a release, which skips it: then there is little to free) leaves its
      # profiles and engine homes in the temp folder (`cuepoint-*`, `cp-*`), and the Windows runner ran
      # out of disk in the packaged release run that follows (test.5, 10-30). Nothing reads them again,
      # so they go, and the free space is printed before and after.
      - name: Free the source run's temp folders
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        shell: bash
        run: |
          tmp="$(node -p "require('os').tmpdir()")"
          df -h "$tmp" || true
          find "$tmp" -maxdepth 1 \( -name 'cuepoint-*' -o -name 'cp-*' -o -name 'showcase-*' \) -exec rm -rf {} + 2>/dev/null || true
          rm -rf apps/desktop-electron/test-results
          df -h "$tmp" || true

      # HARDEN-09. The end-to-end suite against that app, not the source tree: `CUEPOINT_E2E_EXECUTABLE`
      # is read by `e2e/support/launchApp.ts`, which every spec starts the app through. A push (or pull
      # request) runs the specs tagged `@packaged-smoke` (start, import, play, export, quit); a release
      # runs the whole suite. The Linux runner needs the same screen and sound device as above.
      - name: Packaged app end-to-end
        id: packaged-e2e
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        # A push adds a few minutes (Intel the most); a release runs the whole suite, 25 to 35 on Intel.
        timeout-minutes: ${{ inputs.release && 75 || 30 }}
        working-directory: apps/desktop-electron
        env:
          CUEPOINT_E2E_EXECUTABLE: ${{ steps.app.outputs.exe }}
          RELEASE_RUN: ${{ inputs.release && 'true' || 'false' }}
        shell: bash
        run: |
          if [ "$RELEASE_RUN" = "true" ]; then
            filter=""
          else
            filter="--grep @packaged-smoke"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npx playwright test $filter
          else
            npx playwright test $filter
          fi

      # The packaged run's own snapshots: the ones printed above were taken before it ran.
      - name: Print the packaged run's failure snapshots
        if: failure() && steps.packaged-e2e.outcome == 'failure'
        shell: bash
        working-directory: apps/desktop-electron
        run: |
          find test-results -name error-context.md 2>/dev/null | sort | while read -r f; do
            echo "::group::$f"
            head -c 20000 "$f"
            echo "::endgroup::"
          done

      - name: Upload the packaged run's failures
        if: failure() && steps.packaged-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-packaged-failures-${{ matrix.leg }}
          path: apps/desktop-electron/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      # A failed Mac check keeps the leg's files, so the app that failed it can be downloaded.
      - name: Generate SHA256SUMS
        if: always() && steps.package.outcome == 'success'
        working-directory: apps/desktop-electron
        run: python ../../scripts/generate_sha256_sums.py release --leg ${{ matrix.leg }}

      - name: Upload Electron artifacts
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-electron-${{ matrix.leg }}
          path: apps/desktop-electron/release/**

      # DIST-04. Only what a release holds, at the top of `release/`: the installer, dmg, zip or
      # AppImage (`CuePoint-*`, which also names the block maps), the update manifests and this leg's
      # checksums. Not the unpacked app folders, `builder-debug.yml` or `builder-effective-config.yaml`.
      # Kept briefly: the publish job takes them within the hour.
      - name: Upload release files
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.leg }}
          path: |
            apps/desktop-electron/release/CuePoint-*
            apps/desktop-electron/release/*.blockmap
            apps/desktop-electron/release/latest*.yml
            apps/desktop-electron/release/SHA256SUMS-${{ matrix.leg }}.txt
          if-no-files-found: error
          retention-days: 7
