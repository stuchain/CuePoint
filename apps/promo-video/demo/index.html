<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CuePoint demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <div class="bg"></div>
      <div class="brand"><img src="assets/icon.png" alt="" /><span>CuePoint</span></div>
      <div class="count" id="count"></div>
      <div class="captionBox" id="capPrev">
        <div class="chip"></div>
        <div class="caption"></div>
      </div>
      <div class="captionBox" id="capNow">
        <div class="chip"></div>
        <div class="caption"></div>
      </div>
      <div class="window" id="window"><img id="clip" alt="" /><img id="prev" alt="" /></div>
      <ol class="rail" id="rail"></ol>
      <div class="url">usecuepoint.com</div>
      <div class="card open" id="open">
        <img class="card__app" id="openApp" alt="" />
        <div class="card__dim"></div>
        <div class="card__body">
          <img class="card__icon" src="assets/icon.png" alt="" />
          <div class="card__name">CuePoint</div>
          <div class="card__line">Your Rekordbox library, cleaned up and ready for the booth.</div>
          <div class="card__chip">Free and open source</div>
        </div>
      </div>
      <div class="card end" id="end">
        <div class="card__body">
          <img class="card__icon" src="assets/icon.png" alt="" />
          <div class="card__name">CuePoint</div>
          <div class="card__line">Your Rekordbox library, cleaned up and ready for the booth.</div>
          <div class="card__chip">Free and open source</div>
          <div class="card__url">usecuepoint.com</div>
          <div class="card__os">Windows and Mac</div>
        </div>
      </div>
      <div class="fade" id="fade"></div>
    </div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
