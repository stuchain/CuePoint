<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CuePoint demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <div class="bg"></div>
      <div class="brand"><img src="assets/icon.png" alt="" /><span>CuePoint</span></div>
      <div class="count" id="count"></div>
      <div class="captionBox">
        <div class="chip" id="chip"></div>
        <div class="caption" id="caption"></div>
      </div>
      <div class="window" id="window"><img id="clip" alt="" /></div>
      <ol class="rail" id="rail"></ol>
      <div class="url">usecuepoint.com</div>
      <div class="full" id="full"><img id="fullImg" alt="" /></div>
      <div class="fade" id="fade"></div>
    </div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
