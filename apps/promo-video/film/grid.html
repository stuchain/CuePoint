<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CuePoint: grid</title>
    <link rel="stylesheet" href="film.css" />
    <link rel="stylesheet" href="grid.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="paper" id="paper"></div>
      <div class="kin" id="kin">
        <div class="kin__line">TEN</div>
        <div class="kin__line">TOOLS.</div>
        <div class="kin__line">ONE</div>
        <div class="kin__line kin__line--accent">APP.</div>
      </div>
      <div class="panel" id="panel"></div>
      <div class="stripe" id="stripe"></div>
      <div class="tiles" id="tiles"></div>
      <div class="labels" id="labels"></div>
      <div class="chipline" id="chipline">ONE APP</div>
      <div class="end" id="end">
        <div class="end__body">
          <img class="end__icon" src="../demo/assets/icon.png" alt="" />
          <div class="end__name">CuePoint</div>
          <div class="end__line">Your Rekordbox library, cleaned up and ready for the booth.</div>
          <div class="end__chip">Free and open source</div>
          <div class="end__url">usecuepoint.com</div>
          <div class="end__os">Windows and Mac</div>
        </div>
      </div>
      <div class="flash" id="flash"></div>
      <div class="fade" id="fade"></div>
    </div>
    <script type="module" src="grid.js"></script>
  </body>
</html>
