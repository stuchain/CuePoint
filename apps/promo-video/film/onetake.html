<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CuePoint: one take</title>
    <link rel="stylesheet" href="film.css" />
    <link rel="stylesheet" href="onetake.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="layer" id="shot"><img id="clip" alt="" /></div>
      <div class="light" id="light"></div>
      <div class="vignette"></div>
      <div class="dim" id="dim"></div>
      <div class="words" id="words">
        <div class="words__line">The right match.</div>
        <div class="words__line"><b>One click.</b></div>
        <div class="words__small"><img src="../demo/assets/icon.png" alt="" /><span>CuePoint · free and open source · usecuepoint.com</span></div>
      </div>
      <div class="fade" id="fade"></div>
    </div>
    <script type="module" src="onetake.js"></script>
  </body>
</html>
