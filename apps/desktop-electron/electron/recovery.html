<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuePoint</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #17171a;
    color: #f2f2f4;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main { width: min(640px, calc(100% - 64px)); }
  h1 { font: 700 22px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin: 0 0 16px; }
  p { margin: 0 0 24px; }
  button {
    font: 600 14px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #f2f2f4;
    background: #38383f;
    border: 1px solid #6c6c75;
    padding: 9px 10px;
    margin-right: 8px;
    cursor: pointer;
  }
  button.primary { background: #7c3aed; border-color: #7c3aed; }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 2px solid #f2f2f4; outline-offset: 2px; }
  button:disabled { cursor: default; filter: none; opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>CuePoint's window stopped twice</h1>
  <p>It stopped again within a minute of being reopened. Your library is safe. Reload to try once more.</p>
  <div>
    <button type="button" id="reload" class="primary">Reload</button>
    <button type="button" id="report">Report this problem</button>
  </div>
</main>
<script>
  var api = window.cuepointRecovery;
  document.getElementById("reload").addEventListener("click", function () {
    if (api) api.reload();
  });
  document.getElementById("report").addEventListener("click", function (event) {
    var button = event.currentTarget;
    if (!api || button.disabled) return;
    button.disabled = true;
    Promise.resolve(api.report()).then(
      function (sent) { button.textContent = sent ? "Reported" : "Not sent"; },
      function () { button.textContent = "Not sent"; }
    );
  });
</script>
</body>
</html>
