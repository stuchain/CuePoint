<!doctype html>
<html lang="en" data-scale="2" data-theme="neoDark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuePoint</title>
    <!--
      The colour of the app before its stylesheets load (M492). The window is made in the theme's
      colour (main remembers it), and this keeps the page the same colour in the moment between the
      page loading and the first stylesheet: Neo dark by default, and the stored theme's when there
      is one. tokens.css paints the body from --bg-app as soon as it loads, which wins from here.
    -->
    <style id="boot-background">
      html {
        background: #18181b;
      }
    </style>
    <script>
      (function () {
        try {
          var id = localStorage.getItem("cuepoint-ui-lab-theme") || "neoDark";
          var builtIn = {
            retro16: "#1a1a2e",
            neoDark: "#18181b",
            qtEvolved: "#1e1e1e",
            clubNeon: "#0a0a0f",
            mutedPro: "#1c1f26",
          };
          var background = builtIn[id];
          if (!background && id.indexOf("custom:") === 0) {
            var themes = JSON.parse(localStorage.getItem("cuepoint-ui-lab-custom-themes") || "[]");
            for (var at = 0; at < themes.length; at += 1) {
              var theme = themes[at];
              if (theme && "custom:" + theme.id === id && theme.colors) {
                var colour = theme.colors.bgApp;
                if (typeof colour === "string" && /^#[0-9a-fA-F]{3,8}$/.test(colour)) background = colour;
              }
            }
          }
          if (background) {
            document.getElementById("boot-background").textContent = "html { background: " + background + "; }";
          }
        } catch (error) {
          // Storage can be unavailable; the default colour stands.
        }
      })();
    </script>
    <!--
      Motion before the first paint (M381). MotionProvider writes data-motion-<kind> on <html>, but
      only once React runs; this writes the same from storage first, so the first frame already
      knows which kinds move. The same rule as tokens/motion.ts and MotionContext: every kind on
      unless switched off, and none while the system asks for reduced motion and Follow system is
      chosen (the default). motionBoot.test.ts holds the kinds and keys to that file.
    -->
    <script id="boot-motion">
      (function () {
        try {
          var kinds = ["micro", "interaction", "state", "page", "entrance", "hover", "scroll", "loading", "shared", "feedback"];
          var overrides = {};
          try {
            var parsed = JSON.parse(localStorage.getItem("cuepoint-motion") || "{}");
            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) overrides = parsed;
          } catch (error) {
            overrides = {};
          }
          var follow = localStorage.getItem("cuepoint-motion-follow-system") !== "false";
          var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          var root = document.documentElement;
          for (var at = 0; at < kinds.length; at += 1) {
            var on = overrides[kinds[at]] !== false && !(reduced && follow);
            if (on) root.setAttribute("data-motion-" + kinds[at], "on");
            else root.removeAttribute("data-motion-" + kinds[at]);
          }
        } catch (error) {
          // Storage can be unavailable; MotionProvider writes the attributes when it mounts.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
